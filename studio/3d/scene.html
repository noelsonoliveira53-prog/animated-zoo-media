<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#9fdcff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { buildMilo } from "./milo3d.js";

// ---------- world: a sunny toy-like zoo meadow ----------
function skyTexture() {
  const c = document.createElement("canvas"); c.width = 16; c.height = 512; const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 512); grd.addColorStop(0, "#5fb8ff"); grd.addColorStop(0.55, "#bfe8ff"); grd.addColorStop(1, "#fff3d6");
  g.fillStyle = grd; g.fillRect(0, 0, 16, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function world(scene) {
  const mat = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), mat(0x86cf6a)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const path = new THREE.Mesh(new THREE.RingGeometry(5.5, 7.2, 64, 1, Math.PI * 1.05, Math.PI * 0.9), mat(0xf2d7a1)); path.rotation.x = -Math.PI / 2; path.position.y = 0.01; path.receiveShadow = true; scene.add(path);
  const tree = (x, z, s = 1, c = 0x4caf50) => {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 1.4, 10), mat(0x8d5a3b)); trunk.position.y = 0.7; trunk.castShadow = true; g.add(trunk);
    for (const [y, r] of [[1.8, 1.0], [2.5, 0.8], [3.1, 0.55]]) { const b = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16), mat(c, 0.7)); b.position.y = y; b.castShadow = true; b.receiveShadow = true; g.add(b); }
    scene.add(g);
  };
  [[-6, -6, 1.3], [6.5, -7, 1.5], [-9, -2, 1.1, 0x66bb6a], [9, -2.5, 1.2, 0x43a047], [-3, -10, 1.6], [3.5, -11, 1.4, 0x66bb6a]].forEach(a => tree(...a));
  const bush = (x, z, s) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 20, 14), mat(0x5cb85c, 0.7)); b.position.set(x, 0.35 * s, z); b.scale.y = 0.7; b.castShadow = true; scene.add(b); };
  [[-3.5, -3, 1], [3.8, -3.4, 1.2], [-5, 1.5, 0.8], [5.2, 1, 0.9]].forEach(a => bush(...a));
  for (let i = 0; i < 9; i++) { // little fence behind
    const x = -8 + i * 2; const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.9, 0.18), mat(0xffffff, 0.5)); post.position.set(x, 0.45, -4.6); post.castShadow = true; scene.add(post);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(16.4, 0.12, 0.08), mat(0xffffff, 0.5)); rail.position.set(0, 0.7, -4.6); rail.castShadow = true; scene.add(rail);
  const rail2 = rail.clone(); rail2.position.y = 0.35; scene.add(rail2);
  const flowers = [0xff7aa2, 0xffd54f, 0xffffff, 0xba68c8];
  for (let i = 0; i < 60; i++) { const a = i * 2.39996, r = 2.5 + (i % 9) * 0.9; const f = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), mat(flowers[i % 4], 0.6)); f.position.set(Math.cos(a) * r, 0.07, Math.sin(a) * r - 1); scene.add(f); }
  const clouds = new THREE.Group(); scene.add(clouds);
  for (const [x, y, z, s] of [[-8, 7, -18, 1.4], [6, 8, -20, 1.8], [14, 6.5, -16, 1.1]]) {
    const c = new THREE.Group(); c.position.set(x, y, z); c.scale.setScalar(s);
    for (const [dx, dy, r] of [[0, 0, 1], [1, 0.2, 0.8], [-1, 0.1, 0.75], [0.4, 0.6, 0.7]]) { const p = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 })); p.position.set(dx, dy, 0); c.add(p); }
    clouds.add(c);
  }
  return { clouds };
}

// ---------- setup ----------
let renderer, scene, camera, milo, env, cfg;
window.setup = (c) => {
  cfg = c;
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(cfg.w, cfg.h);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);
  scene = new THREE.Scene(); scene.background = skyTexture(); scene.fog = new THREE.Fog(0xcdeeff, 22, 45);
  scene.add(new THREE.HemisphereLight(0xdff3ff, 0x6fae4f, 1.1));
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(5, 9, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); sun.shadow.radius = 4; scene.add(sun);
  const rim = new THREE.DirectionalLight(0xbfe1ff, 0.8); rim.position.set(-4, 3, -6); scene.add(rim);
  env = world(scene);
  milo = buildMilo(THREE); milo.group.position.y = 1.24; scene.add(milo.group);
  camera = new THREE.PerspectiveCamera(32, cfg.w / cfg.h, 0.1, 100);
  return true;
};

// ---------- timeline: hop in, wave, talk, look around ----------
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
window.renderAt = (t) => {
  const f = Math.round(t * cfg.fps), talk = (cfg.mouth && cfg.mouth[f]) || 0;
  const inP = ease(t / 1.8);
  milo.group.position.x = -5 * (1 - inP);
  const hop = t < 1.8 ? 1 : (t > cfg.dur - 1.6 ? 0.6 : 0);
  const look = t < 1.8 ? 0.9 * (1 - inP) : Math.sin(t * 0.7) * 0.25 + (t > cfg.dur - 1.6 ? Math.sin(t * 2) * 0.4 : 0);
  const flap = (t > 1.9 && t < 2.9) ? 1 : 0;
  const blink = (t % 3.1) > 2.95;
  milo.pose(t, { talk, flap, hop, look, blink, tilt: talk * 0.04 });
  for (const c of env.clouds.children) c.position.x += 0; env.clouds.position.x = t * 0.15;
  const push = ease((t - 2) / (cfg.dur - 2));
  const ang = -0.25 + t * 0.03;
  const dist = 10.5 - push * 2.5;
  camera.position.set(Math.sin(ang) * dist, 2.6 - push * 0.5, Math.cos(ang) * dist);
  camera.lookAt(milo.group.position.x * 0.5, 1.25, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/jpeg", 0.92);
};
window.ready = true;
</script>
</body></html>
