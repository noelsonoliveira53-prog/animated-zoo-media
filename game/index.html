<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Grovewatch: Sanctuary Siege</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #10261b; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { display: block; }
      #rotate { display: none; position: fixed; inset: 0; background: #10261b; color: #fff4d6; z-index: 10;
        font: bold 22px "Trebuchet MS", system-ui, sans-serif; text-align: center; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px; padding: 24px; }
      #rotate .phone { width: 64px; height: 104px; border: 6px solid #ffc93c; border-radius: 14px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      /* Phones held upright: the game is landscape, so ask for a rotation. */
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* Boot vignette: shown while the game draws its art in code, removed once the menu is up. */
      #boot { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #2a4a32 0%, #10261b 70%); color: #fff4d6;
        font: bold 26px "Trebuchet MS", system-ui, sans-serif; transition: opacity 0.4s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .sprout { position: relative; width: 70px; height: 70px; }
      #boot .sprout i { position: absolute; left: 31px; bottom: 0; width: 8px; height: 40px; border-radius: 4px; background: #6b4a2a; }
      #boot .sprout b { position: absolute; width: 30px; height: 18px; border-radius: 30px 0; background: #8fdc5a; top: 14px; animation: leaf 1.4s ease-in-out infinite; }
      #boot .sprout b.l { left: 6px; transform-origin: right bottom; }
      #boot .sprout b.r { right: 6px; border-radius: 0 30px; transform-origin: left bottom; animation-delay: 0.2s; }
      @keyframes leaf { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
      #boot small { font-size: 14px; opacity: 0.7; font-weight: normal; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><div class="sprout"><i></i><b class="l"></b><b class="r"></b></div><div>Grovewatch</div><small>Growing the grove…</small></div>
    <div id="rotate"><div class="phone"></div><div>Turn your phone sideways to play Grovewatch</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
